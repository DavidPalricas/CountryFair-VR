<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No page zoom anywhere: the page is a 3D scene plus panels, nothing to zoom into.
         maximum-scale=1 + user-scalable=no turn off pinch zoom on Android (phones and tablets),
         and maximum-scale=1 also stops iOS Safari zooming in when a <select> with text under
         16px gets focus (the session parameter dropdowns are 14px). Double-tap zoom is off
         through touch-action in src/index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8e2a22" />
    <title>CountryFairVR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
